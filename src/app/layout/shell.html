<mat-toolbar class="barra">
  <a class="logo" routerLink="/catalog">
    <mat-icon>directions_car</mat-icon>
    <span>Confronto auto</span>
  </a>

  <nav>
    <a mat-button routerLink="/catalog" routerLinkActive="attivo">Archivio</a>
    <a mat-button routerLink="/settings" routerLinkActive="attivo">Impostazioni</a>
    @if (auth.isAdmin()) {
      <a mat-button routerLink="/admin/imports" routerLinkActive="attivo">Revisione</a>
      <a mat-button routerLink="/admin/brands" routerLinkActive="attivo">Marchi</a>
    }
  </nav>

  <span class="spazio"></span>

  <button mat-icon-button [matMenuTriggerFor]="userMenu" aria-label="Menu utente">
    <mat-icon>account_circle</mat-icon>
  </button>
  <mat-menu #userMenu="matMenu">
    <div class="utente" mat-menu-item disabled>{{ auth.user()?.username }}</div>
    <button mat-menu-item (click)="logout()">
      <mat-icon>logout</mat-icon>
      <span>Esci</span>
    </button>
  </mat-menu>
</mat-toolbar>

<main class="contenuto">
  <router-outlet />
</main>
