# Research agent di Confronto auto: ogni 30 minuti chiede all'API cosa c'è da aggiornare,
# legge i siti ufficiali delle case e manda i risultati (vedi agent/README.md).
name: Confronto auto · Research agent

on:
  schedule:
    # ogni 30 minuti; minuti "strani" perché allo scoccare dell'ora GitHub è affollato e ritarda
    - cron: '7,37 * * * *'
  workflow_dispatch:
    inputs:
      max_llm_calls:
        description: Chiamate all'AI al massimo in questa esecuzione
        default: '5'
      dry_run:
        description: Prova senza inviare niente all'API
        type: boolean
        default: false
      rounds:
        description: Giri di fila (1 minuto di pausa tra uno e l'altro; max 20)
        default: '1'

# mai due esecuzioni insieme: la seconda aspetta la prima
concurrency:
  group: confronto-auto-agent
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: agent
    env:
      CA_API_URL: ${{ vars.CA_API_URL || 'https://www.gianlucadario.com/extra/confronto-auto/api' }}
      CA_AGENT_TOKEN: ${{ secrets.CA_AGENT_TOKEN }}
      # catena di AI gratuite: si usa la prima con quota disponibile, poi le altre (basta creare il secret per attivarla)
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      # facoltativi: modello di ogni servizio (variables GEMINI_MODEL, MISTRAL_MODEL...) e ordine (LLM_ORDER=mistral,gemini)
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
      MISTRAL_MODEL: ${{ vars.MISTRAL_MODEL }}
      CEREBRAS_MODEL: ${{ vars.CEREBRAS_MODEL }}
      GROQ_MODEL: ${{ vars.GROQ_MODEL }}
      OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
      LLM_ORDER: ${{ vars.LLM_ORDER }}
      # un servizio qualsiasi compatibile OpenAI: variables LLM_BASE_URL e LLM_MODEL, secret LLM_API_KEY
      LLM_MODEL: ${{ vars.LLM_MODEL }}
      LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      MAX_LLM_CALLS: ${{ inputs.max_llm_calls || vars.MAX_LLM_CALLS || '5' }}
      # lavori presi per giro: più chiamate all'AI = più lavori (un modello ne usa 1-2)
      MAX_TASKS: ${{ inputs.max_llm_calls || vars.MAX_LLM_CALLS || '5' }}
      DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
      BROWSER: playwright

    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: agent

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: agent/package-lock.json

      - name: Ci sono lavori in scadenza?
        id: peek
        run: |
          if [ -z "$CA_AGENT_TOKEN" ]; then
            echo "::warning::Manca il secret CA_AGENT_TOKEN: agent disattivato"
            echo "due=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          npm ci --no-audit --no-fund --omit=optional
          if ! due=$(node src/index.mjs --peek); then
            echo "::error::L'API non risponde o rifiuta il token: controlla che il secret CA_AGENT_TOKEN sia uguale ad agent_token di config.php"
            exit 1
          fi
          echo "Lavori in scadenza: $due"
          echo "due=$due" >> "$GITHUB_OUTPUT"

      # il browser (1-2 minuti di installazione) solo se c'è davvero qualcosa da fare
      - name: Installa il browser
        if: steps.peek.outputs.due != '0'
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      # più giri di fila solo se avviato a mano con "Giri" > 1 (utile all'inizio per vedere subito i risultati)
      - name: Ricerca
        if: steps.peek.outputs.due != '0'
        env:
          ROUNDS: ${{ inputs.rounds || '1' }}
        run: |
          rounds=$(( ROUNDS > 20 ? 20 : (ROUNDS < 1 ? 1 : ROUNDS) ))
          for round in $(seq 1 "$rounds"); do
            [ "$rounds" -gt 1 ] && echo "::group::Giro $round di $rounds"
            code=0
            node src/index.mjs || code=$?
            [ "$rounds" -gt 1 ] && echo "::endgroup::"
            # 3 = quota gratuita finita su tutti i servizi AI: inutile fare altri giri oggi
            if [ "$code" -eq 3 ]; then
              echo "::notice::Quota AI finita per oggi: mi fermo al giro $round"
              break
            fi
            [ "$code" -ne 0 ] && echo "::warning::Giro $round finito con un errore"
            if [ "$round" -lt "$rounds" ]; then
              [ "$(node src/index.mjs --peek)" = "0" ] && { echo "Niente altro in scadenza"; break; }
              sleep 60
            fi
          done
